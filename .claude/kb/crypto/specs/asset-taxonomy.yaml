# -------------------------------------------------------------------
# EXCHANGES
# -------------------------------------------------------------------
exchanges:
  binance:
    type: global_cex
    regulation: partial  # CVM/BCB monitored, not fully regulated in Brazil
    spot_fee_maker_pct: 0.10
    spot_fee_taker_pct: 0.10
    futures_fee_maker_pct: 0.02
    futures_fee_taker_pct: 0.05
    max_leverage_btc: 125
    margin_modes: [isolated, cross]
    funding_interval_hours: 8
    daily_volume_usd: 217000000000
    tax_reporting: manual
    brazil_brl_withdrawal: possible_with_iof

  btg_pactual:
    type: brazilian_regulated_bank
    regulation: full  # CVM + Banco Central
    supported_assets: [BTC, ETH]
    fee_type: spread_based
    typical_spread_pct: 0.5_to_1.5
    leverage: none
    tax_reporting: automatic  # Informe de Rendimentos
    brazil_brl_withdrawal: native

  mercado_bitcoin:
    type: brazilian_cex
    regulation: full  # BCB authorized
    supported_assets: many
    tax_reporting: automatic
    brazil_brl_withdrawal: native

  toro_investimentos:
    type: brazilian_regulated_broker  # Fintech broker, now Santander Corretora
    parent_company: Santander Brasil  # Acquired 2021-2023
    regulation: full  # BCB + CVM + B3 + Anbima
    supported_assets:
      - b3_crypto_etfs  # QBTC11, HASH11, BITH11, ETHE11, BITC11, etc.
      - bitcoin_futures_b3  # BIT contracts, min margin ~R$ 45
      - direct_crypto_expanding  # BTC, ETH, SOL + others from Jan 2026
    fee_type: zero_corretagem_b3  # R$ 0 brokerage on B3 assets
    typical_spread_direct_pct: null  # TBD — Santander-integrated pricing
    leverage: b3_futures_margin_only
    tax_reporting: automatic  # Informe de Rendimentos via B3
    brazil_brl_withdrawal: native  # PIX/TED, no IOF friction
    multi_asset_account: true  # Stocks, ETFs, renda fixa, FIIs, and crypto in one account
    client_base_approx: 3000000  # Combined Toro + Santander Corretora (2025)
    target_clients_2026: 4000000

# -------------------------------------------------------------------
# BRAZIL TAX RULES (2026)
# -------------------------------------------------------------------
brazil_tax_2026:
  capital_gains_rate_pct: 17.5
  reporting_threshold_monthly_brl: 35000
  declaration_threshold_holdings_brl: 5000
  darf_deadline: "last business day of following month"
  cost_basis_method: FIFO
  loss_offset: within_crypto_category
  b3_etf_loss_offset: renda_variavel_category  # Can offset stock gains
  irpf_codes:
    BTC: "8180"
    ETH: "8182"
    other_crypto: "8183"
    stablecoins: "8190"
    nfts: "8191"
  legislation:
    - "Medida Provisoria 1.303/2025"
    - "Instrucao Normativa RFB 1.888/2019"
    - "BCB Comunicado 40.874/2023"

# -------------------------------------------------------------------
# RISK TIERS
# -------------------------------------------------------------------
risk_tiers:
  1:
    label: Low (for crypto)
    assets: [BTC, ETH, B3_ETFs]
    max_position_pct_portfolio: 40
    max_leverage: 3
    typical_stop_pct: "3-7"
  2:
    label: Medium
    assets: [SOL, BNB, ADA, AVAX, LINK]
    max_position_pct_portfolio: 20
    max_leverage: 2
    typical_stop_pct: "6-12"
  3:
    label: High
    assets: [DeFi_tokens, L2_tokens]
    max_position_pct_portfolio: 10
    max_leverage: 1
    typical_stop_pct: "10-20"
  4:
    label: Speculative
    assets: [meme_coins, micro_caps]
    max_position_pct_portfolio: 5
    max_leverage: 1
    typical_stop_pct: "15-30"

# -------------------------------------------------------------------
# ON-CHAIN METRICS REFERENCE
# -------------------------------------------------------------------
on_chain_metrics:
  hash_rate:
    bullish_signal: rising
    bearish_signal: significant_decline
    tool: glassnode
  active_addresses:
    healthy_range: "400K+ daily for BTC"
    tool: glassnode
  exchange_netflow:
    bullish: negative  # BTC leaving exchanges
    bearish: positive  # BTC entering exchanges for selling
    tool: cryptoquant
  mvrv_ratio:
    undervalued: "< 1.0"
    overvalued: "> 3.5"
    tool: glassnode
  sopr:
    bottom_zone: "< 1.0"
    tool: glassnode
  btc_dominance:
    altcoin_season: "< 40%"
    btc_season: "> 60%"
    tool: coinmarketcap

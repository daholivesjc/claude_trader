[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-b3-news"
version = "1.0.0"
description = "MCP server para notícias do mercado financeiro brasileiro (B3)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.scripts]
mcp-b3-news = "server:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
